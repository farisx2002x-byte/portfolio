# فحص أسبوعي للروابط المكسورة وأحجام الصور، يفتح Issue عند وجود مشاكل.
name: weekly-check
on:
  schedule:
    - cron: "0 6 * * 5"          # كل جمعة 06:00 UTC
  workflow_dispatch:
permissions: { contents: read, issues: write }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - id: run
        run: |
          set +e; node scripts/check.mjs --out report.md; echo "code=$?" >> "$GITHUB_OUTPUT"; cat report.md >> "$GITHUB_STEP_SUMMARY"
      - if: steps.run.outputs.code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const body = require('fs').readFileSync('report.md','utf8');
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title: `الفحص الأسبوعي · ${new Date().toISOString().slice(0,10)}`, body, labels: ['maintenance'] });
